name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./daily-wins

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: daily-wins/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Tests
        # Assuming jest is set up or will be. If not, this step might fail or skip. 
        # For now, adding it as placeholder if no test script exists, but likely 'npm test' exists.
        run: npm test -- --passWithNoTests
